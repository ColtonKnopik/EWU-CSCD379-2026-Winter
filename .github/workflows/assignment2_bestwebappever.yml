name: Build and deploy Vue app to Azure Web App - BestWebAppEver

on:
  push:
    branches:
      - Assignment2
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        working-directory: Assignment2/wordle-game
        run: npm install

      - name: Build Vue app
        working-directory: Assignment2/wordle-game
        run: npm run build

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_DA161BE9575B40078E2039721C01EC44 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_8E68DA8D5A474219B515341F202B0ECC }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_AE022B4297DD4D06B7A5C14B653E8BEB }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'BestWebAppEver'
          slot-name: 'Production'
          package: .

          

